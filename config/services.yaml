# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    default_locale: 'fr' # Langue par défaut

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    AlAya\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Common/Helper/'
            - '../src/Common/Repository/sql/'
    auth.checker :
        class: AlAya\Agent\CommonBundle\Service\AuthChecker 
        autowire: true 
        public : true

            
    AlAya\Common\EventSubscriber\LocaleSubscriber:
    
        arguments:
            $authChecker: '@auth.checker'
            $security : '@security.helper'
        tags:
            - { name: kernel.event_subscriber }
    
    twig.extension.assets : 
        class: Symfony\Bridge\Twig\Extension\AssetExtension
        autowire: true
        public: true

    AlAya\Common\Events\EntityCreationListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: postPersist }

    AlAya\Common\Repository\:
        resource: '../src/Common/Repository'
        autowire: true
        autoconfigure: true
    AlAya\Common\Controller\:
        resource: '../src/Common/Controller'
        autowire: true
        autoconfigure: true
    AlAya\Common\Service\Encryptor:
        arguments:
            $appSecret: '%encryptor.key%'
    AlAya\Agent\PrestationBundle\WorkFlow\:
        resource: '../src/Agent/PrestationBundle/WorkFlow'
        autowire: true
        autoconfigure: true

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

imports:
    - { resource: "../config/parameters.yaml" }
