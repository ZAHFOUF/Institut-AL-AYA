doctrine:
    dbal:
        url: '%database.url%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            AlAya:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Common/Entity'
                prefix: 'AlAya\Common\Entity'
                alias: Common
        controller_resolver:
            auto_mapping: false
        dql:
            datetime_functions:
                DATE: DoctrineExtensions\Query\Mysql\Date
                MONTH: DoctrineExtensions\Query\Mysql\Month
                YEARMONTH: DoctrineExtensions\Query\Mysql\YearMonth
                YEAR: DoctrineExtensions\Query\Mysql\Year
                JSON_OVERLAPS: AlAya\Common\Doctrine\JSONOverlapsFunction
                JSON_CONTAINS : DoctrineExtensions\Query\Mysql\JsonContains
                JSON_QUOTE: AlAya\Common\Doctrine\JsonQuoteFunction
                IFNULL :  DoctrineExtensions\Query\Mysql\IFNULL
        filters:
            soft_delete:
                class: AlAya\Common\Doctrine\SoftDeleteFilter
                enabled: true

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
